# What the Vite dev server's proxy does in development, done in production.
# The browser sees one origin for both the page and the API, which is what
# lets the session cookies work without CORS and without SameSite=None. See
# README.md and app/auth/cookies.py.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The trailing slash on proxy_pass is what strips /api: with it, nginx
    # replaces the matched /api/ prefix rather than appending to it, so
    # /api/auth/login reaches the API as /auth/login. Without it the API
    # would be asked for /api/auth/login and answer 404 -- the single most
    # common way this file goes wrong.
    location /api/ {
        proxy_pass http://api:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads are resumes and postings, capped at 5 MB by the API
        # (MAX_FILE_BYTES). nginx defaults to 1 MB and would reject a legal
        # upload with a 413 the application never sees.
        client_max_body_size 8m;

        # An ingestion embeds every chunk of a document and a match calls an
        # LLM; both routinely outlast the 60 second default.
        proxy_read_timeout 120s;
    }

    # Client-side routing: /matches/<id> is a route this application knows
    # and a file nginx does not have. Without the fallback every URL except
    # / is a 404 on reload -- which works while clicking around and breaks
    # the moment somebody shares a link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The bundle's name carries a content hash, so a given URL never changes
    # content and may be cached indefinitely. index.html must not be: it is
    # what points at the current bundle.
    # One directive, not `expires` plus `add_header`: those emit two separate
    # Cache-Control headers, and a reader then has to know which one wins.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
