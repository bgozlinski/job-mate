name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image as docker-compose: pgvector ships with the extension the
        # ingestion stage will need, and CI should not drift from development.
        image: pgvector/pgvector:pg18
        env:
          # Must match the POSTGRES_* values in the job env below.
          POSTGRES_DB: jobmate
          POSTGRES_USER: jobmate
          POSTGRES_PASSWORD: jobmate
        ports:
          - 5432:5432
        # Steps run on the runner, not inside the service network, so without
        # a healthcheck they would start before Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U jobmate -d jobmate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        # Same image as docker-compose: the embedding cache tests talk to a
        # real Redis rather than a fake, so CI has to provide one.
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Settings reads .env, which is not committed, but plain environment
      # variables work just as well. Every required field has to be here.
      POSTGRES_DB: jobmate
      POSTGRES_USER: jobmate
      POSTGRES_PASSWORD: jobmate
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      # Signs tokens that live for the duration of this job. Deliberately a
      # literal and not a secret: it protects nothing, and a secret would
      # break runs from forks. Still 32+ bytes, the minimum HS256 key length
      # per RFC 7518 -- a shorter one makes PyJWT warn on every call.
      JWT_SECRET_KEY: ci-only-throwaway-key-padded-to-32-bytes

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group ui

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Lint, format, type-check and security scan
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # The web client's types are generated from this document, so a schema
      # that changed without it being regenerated would leave the frontend
      # compiling against a shape the API no longer has. Checked here rather
      # than in the web job because this is the job that has uv; the web job
      # checks the file generated from this one.
      - name: Check the OpenAPI document matches the application
        run: |
          uv run python -m scripts.export_openapi web/openapi.json
          git diff --exit-code -- web/openapi.json

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check models match migrations
        run: uv run alembic check

      - name: Test
        run: uv run pytest

  web:
    runs-on: ubuntu-latest

    # Node only. The document the types come from is committed, so this job
    # needs neither Python, nor a database, nor the API running.
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The other half of the check in the quality job: that one proves
      # openapi.json matches the application, this one proves schema.d.ts
      # matches openapi.json. Together they make it impossible to change a
      # Pydantic model and leave the frontend's types behind.
      - name: Check the generated types match the OpenAPI document
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
