services:
  db:
    image: pgvector/pgvector:pg18
    container_name: db-service
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: redis-service
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: api-service
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      # Prefiks, pod ktorym przegladarka widzi to API -- zdejmowany przez proxy
      # w serwisie `web` (dev) i w nginxie (prod). Sciezka ciasteczka refresh
      # jest dopasowywana do adresu w pasku przegladarki, a nie do tego, co
      # widzi ten proces, wiec bez tego ciasteczko dostaje Path=/auth i nigdy
      # nie wraca na /api/auth/refresh. Objaw: kazde odswiezenie sesji konczy
      # sie 401, nie do odroznienia od wygasniecia. Musi zgadzac sie z
      # prefiksem z web/vite.config.ts i web/nginx.conf.
      COOKIE_PATH_PREFIX: /api
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      # .env is dockerignored, so without this mount the container never sees
      # the file -- compose passes its contents as environment variables, and
      # a misspelt name among those is invisible to Settings(extra="forbid").
      # Read-only, and a mount rather than a COPY: the file stays out of the
      # image.
      - ./.env:/app/.env:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- Automat zbierania ofert (FR-7) -----------------------------------------
  # Ten sam obraz co `api`, inny proces. Osobny serwis, a nie watek w `api`,
  # bo skalowanie API zwielokrotniloby przebiegi: dwie repliki API to dwa
  # serwery, dwa harvestery to dwa crawle tego samego serwisu -- czyli
  # dokladnie to, czego zabrania NFR-5. Bez `ports`: nic sie tu nie laczy.

  harvester:
    container_name: harvester-service
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    command:
      - python
      - -m
      - app.worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      # Pajaki i ich ustawienia. Worker odpala je jako osobny proces
      # (`python -m scrapy.cmdline crawl`), wiec katalog musi byc w obrazie
      # obok scrapy.cfg -- inaczej `scrapy crawl` nie znajdzie projektu.
      - ./harvester:/app/harvester
      - ./.env:/app/.env:ro
    # SIGTERM zatrzymuje dopiero NASTEPNY przebieg, nigdy trwajacy. Przebieg
    # dluzszy niz to okno zostanie zabity i to jest bezpieczne, a nie tylko
    # tolerowane: pajak commituje kazda oferte osobno, a drenaz jest
    # idempotentny, wiec ubity przebieg zostawia wiersze `pending`, ktore
    # nastepny start dokancza bez ponownego pobierania czegokolwiek.
    stop_grace_period: 30s

  # --- Klient w przegladarce --------------------------------------------------
  # Serwer deweloperski Vite. Proxuje /api na kontener `api`, wiec przegladarka
  # widzi jeden origin -- bez tego ciasteczka sesji wymagalyby CORS-a z
  # credentials i SameSite=None (patrz app/auth/cookies.py i web/README.md).

  web:
    container_name: web-service
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      # Adres, pod ktory Vite przekazuje /api. Nazwa serwisu, nie localhost:
      # z wnetrza kontenera localhost to on sam.
      JOBMATE_API_URL: http://api:8000
      # Bind mount z Windowsa nie propaguje zdarzen inotify, wiec bez
      # odpytywania hot reload nie reaguje na zapis pliku. Kosztuje troche CPU
      # i dlatego nie jest wlaczone na stale w vite.config.ts.
      CHOKIDAR_USEPOLLING: "true"
    # Instalacja przy starcie, a nie tylko w obrazie. node_modules ponizej jest
    # nazwanym wolumenem, a Docker zasiewa taki wolumen zawartoscia obrazu
    # WYLACZNIE gdy jest pusty -- po dodaniu zaleznosci `--build` nic nie
    # zmienia, bo wolumen juz istnieje. Objaw: "Failed to resolve import" na
    # pakiet, ktory na hoscie jest zainstalowany. `npm install` jest tanie, gdy
    # drzewo juz sie zgadza, i naprawia to samo.
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./web:/web
      # Nazwany wolumen, a nie bind mount. node_modules na hoscie jest zbudowane
      # dla Windowsa, a esbuild i rollup maja natywne binaria -- wpuszczone do
      # Alpine daja "cannot execute binary file", nie brakujacy pakiet. Docker
      # zasiewa pusty wolumen zawartoscia obrazu, wiec kontener dostaje wlasne,
      # linuksowe drzewo.
      - web_node_modules:/web/node_modules

  # Produkcyjny wariant: zbudowane pliki za nginxem, ktory przejmuje role proxy
  # od serwera deweloperskiego. Za profilem, bo `docker compose up` ma podnosic
  # srodowisko deweloperskie -- ten obraz uruchamia sie swiadomie:
  #
  #     docker compose --profile prod up --build web-prod
  web-prod:
    container_name: web-prod-service
    profiles: [prod]
    build:
      context: ./web
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  # --- Langfuse (NFR-2: trace'y wywolan LLM i retrievalu) --------------------
  # Self-hosted v3 to szesc kontenerow. Konfiguracja siedzi w .env.langfuse, a
  # nie w .env: serwis `api` montuje .env i ma Settings(extra="forbid"), wiec
  # kazdy klucz Langfuse'a w tamtym pliku wywalilby aplikacje na starcie.
  #
  # Uwaga na dwa poziomy zmiennych. `env_file` trafia do kontenera, ale NIE do
  # interpolacji ${...} w tym YAML-u -- compose czyta do niej wylacznie root-owy
  # .env. Dlatego healthchecki ponizej maja wartosci wpisane na sztywno.

  langfuse-web:
    image: langfuse/langfuse:4
    container_name: langfuse-web-service
    restart: unless-stopped
    env_file:
      - .env.langfuse
    ports:
      - "3000:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    healthcheck:
      # Nie localhost: serwer Next.js w trybie standalone slucha wylacznie na
      # adresie spod $HOSTNAME, czyli na IP kontenera w sieci compose. Na 127.0.0.1
      # nie ma nikogo i proba przez loopback dostaje "connection refused" bez konca.
      # Publikacja portu 3000 dziala mimo to, bo Docker robi DNAT na IP kontenera.
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider \"http://$$HOSTNAME:3000/api/public/health\" || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      # Pierwszy start odpala migracje Prismy i ClickHouse'a -- zanim serwer
      # zaczyna odpowiadac, mija ponad minute.
      start_period: 120s

  langfuse-worker:
    image: langfuse/langfuse-worker:4
    container_name: langfuse-worker-service
    restart: unless-stopped
    env_file:
      - .env.langfuse
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      # Migracje Prismy i ClickHouse'a odpala wylacznie web. Bez tego czekania
      # worker startuje rownolegle i przez pierwsze sekundy zasypuje logi bledami
      # "relation does not exist" -- nieszkodliwymi, ale mylacymi przy diagnozie.
      langfuse-web:
        condition: service_healthy
    # Bez healthchecka celowo: nic od workera nie zalezy, a jego brak w stanie
    # "healthy" jest tu poprawny. To on konsumuje kolejke BullMQ i zapisuje
    # trace'y do ClickHouse -- bez niego UI wstaje, ale zostaje puste.

  langfuse-db:
    image: postgres:17-alpine
    container_name: langfuse-db-service
    restart: unless-stopped
    env_file:
      - .env.langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    # Bez publikacji portu: 5432 na hoscie nalezy do `db`, a do tej bazy
    # wchodza tylko web i worker z sieci compose.
    healthcheck:
      # Na sztywno, bo ${POSTGRES_USER} z .env.langfuse jest tu niewidoczne --
      # interpolacja czyta root-owy .env, gdzie ta zmienna znaczy co innego.
      test: [ "CMD-SHELL", "pg_isready -U langfuse -d langfuse" ]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse-redis:
    image: redis:8-alpine
    container_name: langfuse-redis-service
    restart: unless-stopped
    env_file:
      - .env.langfuse
    # $$ zostaje zjedzone przez compose i do powloki w kontenerze trafia $, wiec
    # haslo bierze sie ze zmiennej srodowiskowej zamiast byc zduplikowane w YAML-u.
    command: sh -c 'redis-server --requirepass "$$REDIS_AUTH"'
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_AUTH\" ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    container_name: clickhouse-service
    restart: unless-stopped
    user: "101:101"
    env_file:
      - .env.langfuse
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    # Porty 8123/9000 nie ida na hosta: 9000 kolidowaloby z MinIO, a klientami
    # sa wylacznie web i worker.
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: minio-service
    restart: unless-stopped
    env_file:
      - .env.langfuse
    # mkdir przed startem serwera tworzy bucket `langfuse` -- MinIO nie zrobi
    # tego sam, a worker bez niego wpada w petle bledow zapisu.
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server /data --address ":9000" --console-address ":9001"'
    ports:
      # 9090, bo 9000 na hoscie jest zajete koncepcyjnie przez ClickHouse; ten
      # numer musi sie zgadzac z LANGFUSE_S3_MEDIA_UPLOAD_EXTERNAL_ENDPOINT.
      - "9090:9000"
      # Konsola MinIO -- wygodna do podejrzenia, czy eventy faktycznie leca.
      - "9091:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  web_node_modules:
    driver: local
  langfuse_postgres_data:
    driver: local
  langfuse_clickhouse_data:
    driver: local
  langfuse_clickhouse_logs:
    driver: local
  langfuse_minio_data:
    driver: local
