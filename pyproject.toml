[project]
name = "job-mate"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "B",
    "S",
    "UP",
    "PL",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.bandit]
exclude_dirs = [".venv", ".git", "tests"]

[tool.mypy]
files = ["app", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
