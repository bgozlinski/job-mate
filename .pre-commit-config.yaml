repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml -r app
        language: system
        files: ^app/.*\.py$
        pass_filenames: false
        require_serial: true

      # Last, because it is the slowest and needs the stack up (the suite
      # creates its own database from Settings). pre-commit stashes unstaged
      # changes first, so this runs against exactly what is being committed --
      # which is the point: it is what a partially staged change gets caught by.
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
